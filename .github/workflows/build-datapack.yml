name: Build Neon Sprawl datapack

on:
  workflow_dispatch:
  push:
    branches:
      - integration/lost-cities-schematics
    paths:
      - "schematics/source/**"
      - "tools/**"
      - "datapacks/neon_sprawl/**"
      - ".github/workflows/build-datapack.yml"

permissions:
  contents: write

concurrency:
  group: neon-sprawl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install converter dependency
        run: python -m pip install -r tools/requirements.txt

      - name: Convert Sponge schematics
        run: python tools/convert_schematics.py --input schematics/source --output build/generated

      - name: Assemble datapack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p datapacks/neon_sprawl/data
          rm -rf datapacks/neon_sprawl/data/neoncity
          cp -a build/generated/data/neoncity datapacks/neon_sprawl/data/
          cp build/generated/manifest.json datapacks/neon_sprawl/SCHEMATIC_MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("datapacks/neon_sprawl").rglob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          manifest = json.loads(Path("datapacks/neon_sprawl/SCHEMATIC_MANIFEST.json").read_text())
          if manifest["errors"]:
              print(f"WARNING: {len(manifest['errors'])} schematic(s) were skipped: {manifest['errors']}")
          print(f"Validated {len(files)} JSON files; converted {len(manifest['converted'])} schematics.")
          PY
          mkdir -p build/release
          cd datapacks/neon_sprawl
          zip -qr ../../build/release/neon_sprawl_datapack.zip .
          cd ../..

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datapacks/neon_sprawl/data datapacks/neon_sprawl/SCHEMATIC_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Generated datapack assets are already current."
          else
            git commit -m "Build Neon Sprawl assets from source schematics"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Upload datapack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: neon-sprawl-datapack
          path: build/release/neon_sprawl_datapack.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload conversion manifest
        uses: actions/upload-artifact@v4
        with:
          name: neon-sprawl-conversion-manifest
          path: datapacks/neon_sprawl/SCHEMATIC_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
